{% extends 'base.html' %}
{% block title %}Audit log{% endblock %}
{% block content %}
<h1>Audit log</h1>
<p class="muted">The latest 300 system activities.</p>
<div class="card table-wrap"><table>
  <tr><th>When</th><th>User</th><th>Action</th><th>Detail</th></tr>
  {% for a in rows %}<tr><td>{{ a.created_at|dt }}</td><td>{{ a.username or '-' }}</td><td>{{ a.action }}</td><td>{{ a.detail }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
